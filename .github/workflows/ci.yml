name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/generate_data.py
      - run: python src/optimize.py
      - run: python src/build_artifact.py
      - run: python -m unittest discover -s tests -v
      - name: Verify committed analytical outputs are reproducible
        run: git diff --exit-code -- data dashboard/artifact.json
